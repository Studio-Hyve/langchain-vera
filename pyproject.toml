[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-vera"
version = "0.1.0"
description = "LangChain integration for Vera by Waggle: read pages, search the web, results pages, keyword ideas, AI answers, GEO radar, company footprints and a document loader."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waggle", email = "contact@waggle.ae" }]
requires-python = ">=3.10"
keywords = [
    "langchain", "vera", "waggle", "web scraping", "web search", "markdown", "rag", "agents",
    "serp", "seo", "geo", "keyword research", "ai search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "typing-extensions>=4.7.0",
]

[project.urls]
Homepage = "https://vera.waggle.ae"
Documentation = "https://vera.waggle.ae/docs"
Repository = "https://github.com/Studio-Hyve/langchain-vera"
Issues = "https://github.com/Studio-Hyve/langchain-vera/issues"
Changelog = "https://github.com/Studio-Hyve/langchain-vera/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "langchain-tests>=1.1.0,<2.0.0",
]
lint = ["ruff>=0.13.0,<1.0.0"]
typing = ["mypy>=1.13.0,<3.0.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_vera"]

[tool.hatch.build.targets.sdist]
include = ["langchain_vera", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "B", "C4", "D", "E", "F", "FBT", "I", "N", "PERF", "PIE", "PT", "RET", "RUF",
    "S", "SIM", "T201", "UP", "W",
]
ignore = ["COM812", "ISC001", "PERF203", "S112"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "FBT"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -m 'not live'"
markers = [
    "live: calls the real Vera API, spends credits and needs VERA_API_KEY (run with: pytest -m live)",
]
